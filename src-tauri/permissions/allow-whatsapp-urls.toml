"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-whatsapp-urls"
description = "Permite abrir WhatsApp Web, wa.me y protocolo whatsapp://."

[[permission.scope.allow]]
url = "whatsapp://*"

[[permission.scope.allow]]
url = "https://wa.me/*"

[[permission.scope.allow]]
url = "https://web.whatsapp.com/*"
