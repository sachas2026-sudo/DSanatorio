<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobrar cuotas - Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-6">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-[1px] flex items-center justify-center p-4">
    <!-- Modal -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-7 space-y-5">
      <!-- Encabezado -->
      <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Cobrar cuotas</h2>

      <!-- Tarjeta de información del afiliado -->
      <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
        <p class="text-base font-bold text-gray-900 uppercase tracking-wide">RAMIREZ, SONIA</p>
        <p class="mt-1 text-sm text-gray-500">Familiar · $70.000 por mes</p>
      </div>

      <!-- Sección de meses -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-gray-700 tracking-wide">MESES</span>
          <a href="#" class="text-xs font-semibold text-cyan-700 hover:text-cyan-800">Seleccionar adeudado</a>
        </div>

        <div class="space-y-2">
          <!-- Fila 1 - Seleccionada -->
          <div class="flex items-center gap-3 border border-cyan-600 bg-cyan-50 rounded-xl px-4 py-3">
            <input type="checkbox" checked class="h-4 w-4 rounded border-cyan-600 text-cyan-600 focus:ring-cyan-600" />
            <span class="flex-1 text-sm font-medium text-gray-800">Septiembre 2026</span>
            <span class="inline-flex items-center rounded-md bg-orange-100 text-orange-800 text-xs font-semibold px-2 py-0.5">Adeudado</span>
            <span class="text-sm font-bold text-gray-900">$70.000</span>
          </div>

          <!-- Fila 2 -->
          <div class="flex items-center gap-3 border border-gray-200 bg-white rounded-xl px-4 py-3">
            <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-cyan-600 focus:ring-cyan-600" />
            <span class="flex-1 text-sm font-medium text-gray-800">Octubre 2026</span>
            <span class="inline-flex items-center rounded-md bg-orange-100 text-orange-800 text-xs font-semibold px-2 py-0.5">Adeudado</span>
            <span class="text-sm font-bold text-gray-900">$70.000</span>
          </div>

          <!-- Fila 3 -->
          <div class="flex items-center gap-3 border border-gray-200 bg-white rounded-xl px-4 py-3">
            <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-cyan-600 focus:ring-cyan-600" />
            <span class="flex-1 text-sm font-medium text-gray-800">Noviembre 2026</span>
            <span class="inline-flex items-center rounded-md bg-orange-100 text-orange-800 text-xs font-semibold px-2 py-0.5">Adeudado</span>
            <span class="text-sm font-bold text-gray-900">$70.000</span>
          </div>

          <!-- Fila 4 -->
          <div class="flex items-center gap-3 border border-gray-200 bg-white rounded-xl px-4 py-3">
            <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-cyan-600 focus:ring-cyan-600" />
            <span class="flex-1 text-sm font-medium text-gray-800">Diciembre 2026</span>
            <span class="text-xs font-medium text-gray-400">Adelantar</span>
            <span class="text-sm font-bold text-gray-900">$70.000</span>
          </div>
        </div>
      </div>

      <!-- Pago y botones -->
      <div class="space-y-4">
        <div class="flex items-end justify-between gap-4">
          <label class="flex-1">
            <span class="block text-xs font-medium text-gray-500 mb-1.5">Forma de pago</span>
            <select class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-cyan-600 focus:border-cyan-600">
              <option selected>Efectivo</option>
              <option>Transferencia</option>
              <option>Depósito</option>
              <option>Mercado Pago</option>
              <option>Débito</option>
            </select>
          </label>
          <div class="text-right">
            <p class="text-xs font-medium text-gray-500">TOTAL · 1 MES</p>
            <p class="mt-0.5 text-2xl font-extrabold text-gray-900">$70.000</p>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3 pt-1">
          <button type="button" class="bg-white border border-gray-300 text-gray-800 font-semibold text-sm px-5 py-2.5 rounded-xl hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          <button type="button" class="bg-cyan-600 hover:bg-cyan-700 active:bg-cyan-800 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-sm transition-colors">
            Registrar pago
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
EOF
Write-Host "Archivo creado."
